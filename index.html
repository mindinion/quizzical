<script src="moment.js"></script>
<script src="moment-timezone-with-data-2010-2020.js"></script>
<script src="date.js"></script>
<script src="jquery.js"></script>
<script src="main.js"></script>

<script>

	function notifyError(msg) {
		$("#Notify").removeClass("notify-success").addClass("notify-error").html(msg);
	}
	function notifyLoading() {
		$("#Notify").removeClass("notify-error notify-success").html("<img src='ajax-loader.gif'>");
	}

	function login() {
		notifyLoading();
		var email = $("input[name=email]").val();
		var password = $("input[name=userpass]").val();

		if (email == "" || password == "") {
			notifyError("Please enter a username and password");
			return;
		}

		$.get("action-login.php", { email: email, password: password }, function(data, status) {
			window.res3 = data;
			if (data.trim() === "OK") {
				window.location.href = 'main.html';
			} else if (data.indexOf("Failed") !== -1) {
				notifyError("Incorrect login details");
			} else {
				notifyError("Unexpected response: " + data);
			}
		});
	}

	if (getCookie("session") != null) window.location.href = 'main.html';

</script>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Quizzical</title>
		<link href="styles-login.css?id=3" type="text/css" rel="stylesheet" />
		<link rel="icon" type="image/png" href="quizzical_logo.png">
	</head>
	<body>
		<div id="LoginWrap">
			<img src="logo-secondary.png" id="LoginLogo">
			<div id="Notify"></div>
			<input type="email" name="email" placeholder="Email address" class="login-field">
			<input type="password" name="userpass" placeholder="Password" class="login-field" onkeydown="if(event.keyCode===13)login()">
			<button id="LoginButton" onclick="login()">Log in</button>
			<a href="forgotpassword.html" id="ForgotLink">Forgot password?</a>
			<a href="createaccount.html" id="CreateLink">Create an account</a>
		</div>
	</body>
</html>
