<script src="jquery.js"></script>

<script>

	function notifyError(msg) {
		$("#Notify").removeClass("notify-success").addClass("notify-error").html(msg);
	}
	function notifySuccess(msg) {
		$("#Notify").removeClass("notify-error").addClass("notify-success").html(msg);
	}
	function notifyLoading() {
		$("#Notify").removeClass("notify-error notify-success").html("<img src='ajax-loader.gif'>");
	}

	function getToken() {
		var params = new URLSearchParams(window.location.search);
		return params.get('token') || '';
	}

	function resetPassword() {
		var token = getToken();
		if (!token) {
			notifyError("Invalid or missing reset link.");
			return;
		}
		var passwordA = $("input[name=passwordA]").val();
		var passwordB = $("input[name=passwordB]").val();
		if (passwordA === "" || passwordB === "") {
			notifyError("Please enter and confirm your new password.");
			return;
		}
		if (passwordA !== passwordB) {
			notifyError("Passwords do not match.");
			return;
		}
		notifyLoading();
		$.get("action-resetpassword.php", { token: token, password: passwordA }, function(data) {
			if (data.trim() === "OK") {
				window.location.href = 'main.html';
			} else if (data.trim() === "Expired") {
				notifyError("This reset link has expired. Please <a href='forgotpassword.html'>request a new one</a>.");
			} else {
				notifyError("Invalid or already-used reset link. Please <a href='forgotpassword.html'>request a new one</a>.");
			}
		});
	}

</script>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Quizzical</title>
		<link href="styles-login.css?id=3" type="text/css" rel="stylesheet" />
		<link rel="icon" type="image/png" href="quizzical_logo.png">
	</head>
	<body>
		<div id="LoginWrap">
			<img src="logo-secondary.png" id="LoginLogo">
			<div id="Notify"></div>
			<input type="password" name="passwordA" placeholder="New password" class="login-field">
			<input type="password" name="passwordB" placeholder="Confirm new password" class="login-field">
			<button id="LoginButton" onclick="resetPassword()">Set new password</button>
			<a href="index.html" id="CreateLink">Back to login</a>
		</div>
	</body>
</html>
