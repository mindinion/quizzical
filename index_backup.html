<script>

	function login() {

		// Show the loading graphic, and check we have required data
		$("#Notify").html("<img src = 'ajax-loader.gif'></img>");
		var email = $("input[name=email]").val();
		var password = $("input[name=userpass]").val();
		
		if (email == "" || password == "") {
			$("#Notify").html("Please enter a username and password");
			return;
		}
		
		//  Go to server and log  in, creating new session
		$.get("action-login.php", 
		{ 
			email:email,
			password:password
		},	
		function(data, status) { 
			window.res3 = data;
			if (data.indexOf("Failed") == -1) {
				window.location.href = 'main.html';
			} else {
				$("#Notify").html("Incorrect login details");
			}
		});
		
		
	}

	// If we have a current session, go to the main page
	if (getCookie("session") != null) window.location.href = 'main.html';


</script>
