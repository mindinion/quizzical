<script>

	function switchProfile(area) {
		if (area==1) {
			document.getElementById("Profile").style.display = "inline";
			document.getElementById("Password").style.display = "none";
			//document.getElementById("Notifications").style.display = "none";
			document.getElementById("menu_1").className = "Selected";
			document.getElementById("menu_2").className = "";
			document.getElementById("menu_3").className = "";
		} else if (area==2) {
			document.getElementById("Profile").style.display = "none";
			document.getElementById("Password").style.display = "inline";
			//document.getElementById("Notifications").style.display = "none";
			document.getElementById("menu_1").className = "";
			document.getElementById("menu_2").className = "Selected";
			document.getElementById("menu_3").className = "";

		} else if (area==3) {
			//document.getElementById("Profile").style.display = "none";
			//document.getElementById("Password").style.display = "none";
			//document.getElementById("Notifications").style.display = "inline";
			//document.getElementById("menu_1").className = "";
			//document.getElementById("menu_2").className = "";
			//document.getElementById("menu_3").className = "Selected";

		}
	}
	
</script>


<NavSideBar>
	<NavSideBarItem id="menu_1" class="selected" onclick="switchProfile(1)">Profile</NavSideBarItem><br>
	<hr><br>
	<NavSideBarItem id="menu_2" onclick="switchProfile(2)">Password</NavSideBarItem><br>
	<hr><br>
	<NavSideBarItem id="menu_3" onclick="switchProfile(3)">Notifications</NavSideBarItem><br>

	<NavSideBarButton class="Primary">Save Changes</NavSideBarButton>

</NavSideBar>

  		<label for="lname">Email</label>

</ProfilePanel>
