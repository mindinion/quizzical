<script src="jquery.js"></script>

<script>

	function notifyError(msg) {
		$("#Notify").removeClass("notify-success").addClass("notify-error").html(msg);
	}
	function notifySuccess(msg) {
		$("#Notify").removeClass("notify-error").addClass("notify-success").html(msg);
	}
	function notifyLoading() {
		$("#Notify").removeClass("notify-error notify-success").html("<img src='ajax-loader.gif'>");
	}

	function forgotPassword() {
		notifyLoading();
		var email = $("input[name=email]").val();

		if (email == "") {
			notifyError("Please enter your email address");
			return;
		}

		$.get("action-checkemail.php", { email: email }, function(data, status) {
			if (data.indexOf("Exists") != -1) {
				$.get("action-forgotpassword.php", { email: email }, function(data, status) {
					console.log(data);
					if (data.indexOf("Success") != -1) {
						notifySuccess("Please check your email for your new password — <a href='index.html'>Back to login</a>");
					} else {
						notifyError("There was a problem resetting your password, please contact the webmaster");
					}
				});
			} else {
				notifyError("No account found for this email address");
			}
		});
	}

</script>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Quizzical</title>
		<link href="styles-login.css?id=3" type="text/css" rel="stylesheet" />
		<link rel="icon" type="image/png" href="quizzical_logo.png">
	</head>
	<body>
		<div id="LoginWrap">
			<img src="logo-secondary.png" id="LoginLogo">
			<div id="Notify"></div>
			<input type="email" name="email" placeholder="Email address" class="login-field" onkeydown="if(event.keyCode===13)forgotPassword()">
			<button id="LoginButton" onclick="forgotPassword()">Send reset link</button>
			<a href="index.html" id="CreateLink">Back to login</a>
		</div>
	</body>
</html>
