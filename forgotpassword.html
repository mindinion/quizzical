<script src="jquery.js"></script>

<script>

	function forgotPassword() {
		$("#Notify").html("<img src='ajax-loader.gif'>");
		var email = $("input[name=email]").val();

		if (email == "") {
			$("#Notify").html("Please enter your email address");
			return;
		}

		$.get("action-checkemail.php", { email: email }, function(data, status) {
			if (data.indexOf("Exists") != -1) {
				$.get("action-forgotpassword.php", { email: email }, function(data, status) {
					console.log(data);
					if (data.indexOf("Success") != -1) {
						$("#Notify").html("Please check your email for your new password");
						$("#Notify").append("<br><br><a href='index.html'>Back to login</a>");
					} else {
						$("#Notify").html("There was a problem resetting your password, please contact the webmaster");
					}
				});
			} else {
				$("#Notify").html("No login for this email address");
			}
		});
	}

</script>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Quizzical</title>
		<link href="styles-login.css?id=2" type="text/css" rel="stylesheet" />
		<link rel="icon" type="image/png" href="quizzical_logo.png">
	</head>
	<body>
		<div id="LoginWrap">
			<img src="logo-secondary.png" id="LoginLogo">
			<div id="Notify"></div>
			<input type="email" name="email" placeholder="Email address" class="login-field">
			<button id="LoginButton" onclick="forgotPassword()">Send reset link</button>
			<a href="index.html" id="CreateLink">Back to login</a>
		</div>
	</body>
</html>
