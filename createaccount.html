<script src="jquery.js"></script>

<script>

	function notifyError(msg) {
		$("#Notify").removeClass("notify-success").addClass("notify-error").html(msg);
	}
	function notifySuccess(msg) {
		$("#Notify").removeClass("notify-error").addClass("notify-success").html(msg);
	}
	function notifyLoading() {
		$("#Notify").removeClass("notify-error notify-success").html("<img src='ajax-loader.gif'>");
	}

	function addAccount() {
		notifyLoading();
		var firstName = $("input[name=firstname]").val();
		var lastName = $("input[name=lastname]").val();
		var email = $("input[name=email]").val();
		var password = $("input[name=password]").val();

		if (firstName == "" || lastName == "" || email == "" || password == "") {
			notifyError("Please ensure you provide all details");
			return;
		}

		$.get("action-checkemail.php", { email: email }, function(data, status) {
			if (data.indexOf("Exists") == -1) {
				$.get("action-newaccount.php", { firstname: firstName, lastname: lastName, email: email, password: password }, function(data, status) {
					if (data.trim() === "OK") {
						window.location.href = 'main.html';
					} else {
						notifyError("There was a problem creating your account, please contact the webmaster");
					}
				});
			} else {
				notifyError("This email address already has an account");
			}
		});
	}

	function checkEmail() {
		$.get("action-checkemail.php", { email: $("input[name=email]").val() }, function(data, status) {
			window.res = data;
			if (data.indexOf("Exists") > -1) {
				notifyError("This email address already has an account");
			} else {
				$("#Notify").removeClass("notify-error notify-success").html("");
			}
		});
	}

	function clearNotify() {
		$("#Notify").removeClass("notify-error notify-success").html("");
	}

</script>

<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<title>Quizzical</title>
		<link href="styles-login.css?id=3" type="text/css" rel="stylesheet" />
		<link rel="icon" type="image/png" href="quizzical_logo.png">
	</head>
	<body>
		<div id="LoginWrap">
			<img src="logo-secondary.png" id="LoginLogo">
			<div id="Notify"></div>
			<input type="text" name="firstname" placeholder="First name" class="login-field" onblur="checkEmail();">
			<input type="text" name="lastname" placeholder="Last name" class="login-field" onblur="checkEmail();">
			<input type="email" name="email" placeholder="Email address" class="login-field" onblur="checkEmail();" onfocus="clearNotify();">
			<input type="password" name="password" placeholder="Password" class="login-field">
			<button id="LoginButton" onclick="addAccount()">Create account</button>
			<a href="index.html" id="CreateLink">Back to login</a>
		</div>
	</body>
</html>
